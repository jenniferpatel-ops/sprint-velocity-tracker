// ── Config ────────────────────────────────────────────────────────────────
const DONE_STATUSES = new Set(['Done','Closed','Ready to Deploy']);
const BAPO_STATUSES = new Set(['Ready for Testing','Testing','Ready for UAT','Ready to Deploy']);
const DEV_ACTIONABLE_STATUSES = new Set(['To Do','In Progress','In Review']);

let DAYS_ARR=[], DAYS_LABELS=[], TODAY_IDX=0, ND=0;
let ptoDaysMgr=new Set(), ptoDaysIndiv=new Set();
let ptoDays=ptoDaysMgr;

function buildWorkingDays(startStr, endStr) {
  const days=[], labels=[];
  const d = new Date(startStr+'T00:00:00');
  const e = new Date(endStr+'T00:00:00');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  while (d<=e) {
    const wd=d.getDay();
    if (wd&&wd<6){ days.push(new Date(d)); labels.push(months[d.getMonth()]+' '+d.getDate()); }
    d.setDate(d.getDate()+1);
  }
  return {days,labels};
}

function wdFrom(day){let c=0;for(let d=day;d<=ND;d++)if(!ptoDays.has(d))c++;return c;}

function calcIdeal(committed, adds=[]) {
  const line=[committed];
  for (let i=1;i<=ND;i++){
    let prev=line[i-1];
    const add=adds.find(a=>a.day_idx===i);
    if(add) prev+=add.pts;
    if(ptoDays.has(i)){line.push(Math.round(prev*10)/10);}
    else{const wd=wdFrom(i);const rate=wd>0?prev/wd:0;line.push(Math.max(0,Math.round((prev-rate)*10)/10));}
  }
  return line;
}

function getStatus(actualRem, idealRem) {
  const g=actualRem-idealRem;
  if(g<=-0.5) return {lbl:'↑ Ahead',  bg:'bg',fg:'cg'};
  if(g<=2)    return {lbl:'✓ On track',bg:'bg',fg:'cg'};
  if(g<=5)    return {lbl:'◎ Watch',  bg:'ba',fg:'ca'};
  return             {lbl:'↻ Needs pivot',bg:'br',fg:'cr'};
}

function getDevRunwayBadge(ws) {
  if(!ws) return {lbl:'✓ Dev runway clear',cls:'bdev-ok'};
  if(ws.actionableCount===0&&ws.bapoCount>0) return {lbl:'⏳ In BA/PO queue',cls:'bdev-wait'};
  if(ws.actionablePts<=2&&ws.bapoPts>ws.actionablePts) return {lbl:'◎ Runway thinning',cls:'bdev-thin'};
  return {lbl:'✓ Dev runway clear',cls:'bdev-ok'};
}

function pipeHtml(pipeline, small) {
  const cc=small?'pipe-chip':'sc-chip', fc=small?'pipe-flag':'sc-flag';
  return pipeline.map((p,i)=>
    (i>0?'<span class="pipe-arr">→</span>':'')+
    `<span class="${cc} ${p.cls}">${p.stage} · ${p.count}t · ${p.pts}pt</span>`+
    (p.flag?`<span class="${fc}">∨ ${p.flag}</span>`:'')
  ).join('');
}

function staleSectionHtml(staleTickets, small) {
  if(!staleTickets||!staleTickets.length) return '';
  const chips=staleTickets.map(t=>{
    const lvl=t.staleLevel==='red'?'stale-red':'stale-amber';
    return `<span class="stale-chip ${lvl}">${t.key} · ${t.status} · ${t.staleDays}d idle</span>`;
  }).join('');
  if(small) return `<div class="stale-section-sm"><div class="stale-hdr-sm">⚠ Stale tickets</div><div class="stale-row">${chips}</div></div>`;
  return `<div class="stale-section-lg"><div class="stale-hdr-lg">⚠ Stale tickets — needs follow-up</div><div class="stale-row">${chips}</div></div>`;
}

function blockerSectionHtml(flaggedTickets, small) {
  if(!flaggedTickets||!flaggedTickets.length) return '';
  const items=flaggedTickets.map(t=>{
    const note=t.blockerNote||'';
    const short=note.length>80?note.slice(0,80)+'…':note;
    if(small) return `<div style="margin-bottom:3px;"><span class="blocker-chip">${t.key} · ${t.status}</span>${short?`<div class="blocker-note">${short}</div>`:''}</div>`;
    return `<div style="margin-bottom:5px;"><span class="blocker-chip">${t.key} · ${t.status}</span>${note?`<div class="blocker-note">${note}</div>`:''}</div>`;
  }).join('');
  if(small) return `<div class="blocker-section-sm"><div class="blocker-hdr-sm">🚩 Blocked</div>${items}</div>`;
  return `<div class="blocker-section-lg"><div class="blocker-hdr-lg">🚩 Blocked — needs attention</div>${items}</div>`;
}

let miniCh={}, soloCh=null, curView='mgr';
let DEVS={}, DK=[];

function mkChart(id, d, small) {
  const ideal=calcIdeal(d.committed, d.adds||[]);
  const actual=new Array(ND+1).fill(null);
  actual[0]=d.committed;
  if(TODAY_IDX>0) actual[TODAY_IDX]=d.remainingPts;
  else actual[0]=d.remainingPts;
  const pR=actual.map((v,i)=>v!==null?(i===TODAY_IDX?6:2):0);
  const pC=actual.map((_,i)=>i===TODAY_IDX?'#b45309':'rgba(15,30,53,0.4)');
  const c=document.getElementById(id); if(!c) return null;
  return new Chart(c.getContext('2d'),{
    type:'line',
    data:{labels:DAYS_LABELS,datasets:[
      {label:'Target',data:ideal,borderColor:'#1a7a4a',borderWidth:small?1.5:2,borderDash:[5,3],pointRadius:0,tension:0.1,fill:false},
      {label:'Actual',data:actual,borderColor:'#0f1e35',backgroundColor:'rgba(15,30,53,0.05)',borderWidth:small?2:2.5,pointRadius:pR,pointBackgroundColor:pC,tension:0.1,fill:false,spanGaps:true}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{
        label:c=>`${c.dataset.label}: ${c.parsed.y!==null?c.parsed.y+'pt':'—'}`,
        title:ts=>ts[0].dataIndex===TODAY_IDX?`${DAYS_LABELS[ts[0].dataIndex]} (Today)`:DAYS_LABELS[ts[0].dataIndex]
      }}},
      scales:{
        x:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:small?8:10},color:'#6b7280',maxTicksLimit:small?6:11},border:{display:false}},
        y:{grid:{color:'rgba(0,0,0,0.04)'},ticks:{font:{size:small?8:10},color:'#6b7280'},min:0,border:{display:false},title:{display:!small,text:'Pts remaining',font:{size:9},color:'#9ca3af'}}
      },
      interaction:{intersect:false,mode:'index'}
    }
  });
}

function renderMgr() {
  const ideals={};
  DK.forEach(k=>{ideals[k]=calcIdeal(DEVS[k].committed,DEVS[k].adds)[TODAY_IDX];});

  document.getElementById('sumGrid').innerHTML=DK.map(k=>{
    const d=DEVS[k], st=getStatus(d.remainingPts,ideals[k]);
    const rw=getDevRunwayBadge(d.workload);
    const donePct=d.committed>0?Math.round(d.completedPts/d.committed*100):0;
    const bapoBadge=d.workload&&d.workload.bapoCount>0?`<span class="sum-b bdev-wait" style="margin-left:2px;">${d.workload.bapoCount} w/ BA/PO</span>`:'';
    const hasRedStale=d.staleTickets&&d.staleTickets.some(t=>t.staleLevel==='red');
    const hasStale=d.staleTickets&&d.staleTickets.length>0;
    const staleBadge=hasRedStale?`<span class="sum-b stale-red" style="margin-left:2px;">⚠ ${d.staleTickets.length} stale</span>`:hasStale?`<span class="sum-b stale-amber" style="margin-left:2px;">⚠ ${d.staleTickets.length} stale</span>`:'';
    const blockerBadge=d.flaggedTickets&&d.flaggedTickets.length>0?`<span class="sum-b" style="background:#fef2f2;color:#b91c1c;border:0.5px solid #fca5a5;margin-left:2px;">🚩 ${d.flaggedTickets.length} blocked</span>`:'';
    return `<div class="sum-cell">
      <div class="sum-n">${d.name}</div>
      <div class="sum-p ${st.fg}">${donePct}%<span style="font-size:10px;"> done</span></div>
      <span class="sum-b ${st.bg}">${st.lbl}</span>
      <div style="margin-top:4px;display:flex;gap:2px;justify-content:center;flex-wrap:wrap;">
        <span class="sum-b ${rw.cls}">${rw.lbl}</span>${bapoBadge}${staleBadge}${blockerBadge}
      </div>
    </div>`;
  }).join('');

  Object.values(miniCh).forEach(c=>c&&c.destroy()); miniCh={};
  document.getElementById('cardsGrid').innerHTML=DK.map(k=>{
    const d=DEVS[k], st=getStatus(d.remainingPts,ideals[k]);
    const rw=getDevRunwayBadge(d.workload);
    const donePct=d.committed>0?Math.round(d.completedPts/d.committed*100):0;
    const bapoNote=d.workload&&d.workload.bapoCount>0?`<div class="mc-bapo-note">⏳ ${d.workload.bapoCount} ticket${d.workload.bapoCount>1?'s':''} (${d.workload.bapoPts}pt) awaiting BA/PO action</div>`:'';
    return `<div class="mc">
      <div class="mc-hd">
        <span class="mc-n">${d.name}</span>
        <div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
          <span class="sb ${st.bg}">${st.lbl}</span>
          <span class="sb ${rw.cls}">${rw.lbl}</span>
        </div>
      </div>
      <div class="mc-stats">
        <div class="mcs"><span class="mcs-l">Committed</span><div class="mcs-v">${d.committed}pt</div><span class="mcs-s">sprint total</span></div>
        <div class="mcs"><span class="mcs-l">Remaining</span><div class="mcs-v">${d.remainingPts}pt</div><span class="mcs-s">${donePct}% done</span></div>
        <div class="mcs"><span class="mcs-l">Baseline vel.</span><div class="mcs-v">${d.velBaselineLabel}</div><span class="mcs-s">weighted avg</span></div>
      </div>
      <div class="mc-ch"><canvas id="mc-${k}"></canvas></div>
      ${bapoNote}
      <div class="mc-note">● Sample data mode</div>
      <div class="mc-insight">${d.mgrInsight}</div>
      <div class="pipe-section"><div class="pipe-lbl">Pipeline</div><div class="pipe-row">${pipeHtml(d.pipeline,true)}</div></div>
      ${staleSectionHtml(d.staleTickets||[], true)}
      ${blockerSectionHtml(d.flaggedTickets||[], true)}
    </div>`;
  }).join('');

  document.getElementById('snapList').innerHTML=DK.map(k=>{
    const d=DEVS[k], st=getStatus(d.remainingPts,ideals[k]);
    return `<div class="snap-item"><span class="snap-name">${d.name}<span class="snap-tag ${st.bg}">${st.lbl}</span></span><span class="snap-text">${d.mgrInsight}</span></div>`;
  }).join('');

  setTimeout(()=>{DK.forEach(k=>{miniCh[k]=mkChart(`mc-${k}`,DEVS[k],true);});},60);
}

function renderSolo() {
  const k=document.getElementById('devPick').value, d=DEVS[k];
  const ideals=calcIdeal(d.committed,d.adds), ideal_t=ideals[TODAY_IDX];
  const st=getStatus(d.remainingPts,ideal_t);
  const rw=getDevRunwayBadge(d.workload);
  const donePct=d.committed>0?Math.round(d.completedPts/d.committed*100):0;
  document.getElementById('scName').textContent=d.name;
  const badge=document.getElementById('scBadge'); badge.textContent=st.lbl; badge.className=`sb ${st.bg}`;
  const devBadge=document.getElementById('scDevBadge');
  if(devBadge){devBadge.textContent=rw.lbl;devBadge.className=`sb ${rw.cls}`;}
  const bapoNote=document.getElementById('scBapoNote');
  if(bapoNote){
    if(d.workload&&d.workload.bapoCount>0){
      bapoNote.textContent=`⏳ ${d.workload.bapoCount} ticket${d.workload.bapoCount>1?'s':''} (${d.workload.bapoPts}pt) are currently with BA/PO — no action needed from you on those right now.`;
      bapoNote.style.display='block';
    } else { bapoNote.style.display='none'; }
  }
  document.getElementById('scStats').innerHTML=`
    <div class="scs"><span class="scs-l">Committed</span><div class="scs-v">${d.committed}pt</div><span class="scs-s">sprint total</span></div>
    <div class="scs"><span class="scs-l">Completed</span><div class="scs-v ${d.completedPts>0?'cg':''}">${d.completedPts}pt</div><span class="scs-s">${donePct}% done</span></div>
    <div class="scs"><span class="scs-l">Remaining</span><div class="scs-v">${d.remainingPts}pt</div><span class="scs-s">to reach 100%</span></div>
    <div class="scs"><span class="scs-l">Baseline vel.</span><div class="scs-v">${d.velBaselineLabel}</div><span class="scs-s">rolling avg</span></div>
    <div class="scs"><span class="scs-l">Target today</span><div class="scs-v">${Math.round(ideal_t*10)/10}pt</div><span class="scs-s">ideal remaining</span></div>`;
  document.getElementById('scInsight').textContent=d.devInsight||'';
  document.getElementById('scPipe').innerHTML=pipeHtml(d.pipeline,false);
  const scStaleEl=document.getElementById('scStale');
  if(scStaleEl) scStaleEl.outerHTML=`<div id="scStale">${staleSectionHtml(d.staleTickets||[],false)}</div>`;
  const scBlockersEl=document.getElementById('scBlockers');
  if(scBlockersEl) scBlockersEl.outerHTML=`<div id="scBlockers">${blockerSectionHtml(d.flaggedTickets||[],false)}</div>`;
  if(soloCh){soloCh.destroy();soloCh=null;}
  setTimeout(()=>{soloCh=mkChart('soloC',d,false);},30);
}

function syncPtoButtons() {
  document.querySelectorAll('#ptoRow .pc').forEach((btn,i)=>{
    btn.classList.toggle('on',ptoDays.has(i));
  });
}
function switchDev(){ptoDaysIndiv.clear();syncPtoButtons();renderSolo();}
function setView(v){
  curView=v;
  if(v==='mgr'){ptoDays=ptoDaysMgr;}else{ptoDaysIndiv.clear();ptoDays=ptoDaysIndiv;}
  syncPtoButtons();
  document.getElementById('btnMgr').className='vt-btn'+(v==='mgr'?' on':'');
  document.getElementById('btnInd').className='vt-btn'+(v==='ind'?' on':'');
  document.getElementById('devWrap').style.display=v==='ind'?'block':'none';
  document.getElementById('mgrView').style.display=v==='mgr'?'block':'none';
  document.getElementById('indView').style.display=v==='ind'?'block':'none';
  if(v==='mgr')renderMgr();else renderSolo();
}
function rerender(){if(curView==='mgr')renderMgr();else renderSolo();}

// ── Init ──────────────────────────────────────────────────────────────────
(function init(){
  const {days,labels}=buildWorkingDays(START_STR,END_STR);
  DAYS_ARR=days; DAYS_LABELS=labels; ND=labels.length-1; TODAY_IDX=FORCE_TODAY_IDX;

  DEVS={}; DK=[];
  for (const raw of SAMPLE_DEVS_RAW) {
    const key=raw.name.toLowerCase();
    DK.push(key);
    DEVS[key]={
      name:raw.name, fullName:raw.name,
      committed:raw.committed, completedPts:raw.completedPts,
      remainingPts:raw.committed-raw.completedPts,
      adds:[], pipeline:raw.pipeline,
      workload:raw.workload, staleTickets:raw.staleTickets,
      flaggedTickets:raw.flaggedTickets,
      velBaseline:raw.velBaseline, velBaselineLabel:raw.velBaselineLabel,
      mgrInsight:raw.mgrInsight, devInsight:raw.devInsight
    };
  }

  const now=new Date();
  const nowStr=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const dayNum=TODAY_IDX+1;
  const totalPts=SAMPLE_DEVS_RAW.reduce((s,d)=>s+d.committed,0);

  document.getElementById('app').innerHTML=`
  <div class="vt" style="--dev-count:${DK.length};">
    <div class="sample-banner">⚠ Sample data — connect Jira to see live sprint data</div>
    <div class="vt-hdr">
      <div class="vt-hdr-top">
        <div>
          <h1>Mid-sprint velocity tracker</h1>
          <p>${SPRINT_NAME} · E-Commerce Engineering Team · Sample data</p>
        </div>
        <div class="hdr-pills">
          <span class="live-pill">● Sample</span>
        </div>
      </div>
      <div class="prog-wrap">
        <span class="prog-lbl">Day ${dayNum} of ${ND+1}</span>
        <div class="prog-track"><div class="prog-fill" style="width:${Math.round(dayNum/(ND+1)*100)}%;"></div></div>
        <span class="prog-lbl">${START_STR} → ${END_STR} · ${totalPts} pts committed</span>
      </div>
    </div>

    <div class="vt-toggle">
      <button class="vt-btn on" id="btnMgr" onclick="setView('mgr')">Manager view</button>
      <button class="vt-btn" id="btnInd" onclick="setView('ind')">My view</button>
      <div id="devWrap" style="display:none;margin-left:4px;">
        <select id="devPick" onchange="switchDev()"></select>
      </div>
    </div>

    <div class="vt-pto">
      <span class="pto-lbl">PTO days (click to toggle — adjusts target pace):</span>
      <div id="ptoRow" style="display:flex;gap:5px;flex-wrap:wrap;"></div>
    </div>

    <div id="mgrView">
      <div class="sum-grid" id="sumGrid"></div>
      <div class="cards" id="cardsGrid"></div>
      <div style="padding:0 10px 10px;">
        <div class="snapshot-section" style="margin:0;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);">
          <div class="snap-hdr">⚡ Sprint snapshot</div>
          <div class="snap-list" id="snapList"></div>
        </div>
      </div>
    </div>

    <div id="indView" style="display:none;">
      <div class="solo-wrap">
        <div class="sc">
          <div class="sc-hd">
            <div>
              <div class="sc-n" id="scName"></div>
              <div class="sc-m">${SPRINT_NAME} · ${START_STR} → ${END_STR} · Day ${dayNum} of ${ND+1}</div>
            </div>
            <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
              <span class="sb" id="scBadge"></span>
              <span class="sb" id="scDevBadge"></span>
            </div>
          </div>
          <div class="sc-stats" id="scStats"></div>
          <div class="sc-ch"><canvas id="soloC"></canvas></div>
          <div class="sc-insight" id="scInsight"></div>
          <div class="sc-bapo-note" id="scBapoNote" style="display:none;"></div>
          <div class="sc-pipe">
            <div class="sc-pipe-lbl">Current pipeline</div>
            <div class="sc-pipe-row" id="scPipe"></div>
          </div>
          <div id="scStale"></div>
          <div id="scBlockers"></div>
          <div class="leg-row">
            <div class="leg"><div class="ld"></div>Target pace (100%)</div>
            <div class="leg"><div class="ldot-t"></div>Today (Day ${dayNum})</div>
          </div>
        </div>
      </div>
    </div>

    <div class="vt-foot">Sample data · ${nowStr} · Connect Jira to go live</div>
  </div>`;

  // PTO buttons
  const pr=document.getElementById('ptoRow');
  DAYS_LABELS.forEach((lbl,i)=>{
    const s=document.createElement('span');
    s.className='pc'; s.textContent=lbl;
    s.onclick=()=>{ptoDays.has(i)?(ptoDays.delete(i),s.classList.remove('on')):(ptoDays.add(i),s.classList.add('on'));rerender();};
    pr.appendChild(s);
  });

  // Dev picker
  const dp=document.getElementById('devPick');
  DK.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=DEVS[k].name;dp.appendChild(o);});

  setView('mgr');
})();
</script>
</body>
